name: Market scan (+EV line shop)

# The MARKET track. Predicts nothing: takes Pinnacle's no-vig price as truth and
# logs every bettable book offering better. Shadow-only (card_pick=False) — it
# earns a live slot the same way everything else does, by beating the close over
# ~300 scored bets.
#
# Volume is the binding constraint on the whole programme. Every verdict is
# limited by sample size, and at ~2 picks/day a single model lane needs months
# to prove anything. This is the one thing that accumulates measurable bets
# across every sport at once, which is why it runs four times a day rather than
# once.
#
# COST: the scan itself reads data/cache/odds/*_latest.json and costs ZERO API
# credits. Only the refresh step spends any, and it reuses the same fetch the
# pick pipelines already perform.
on:
  schedule:
    # 06:17, 12:17, 18:17, 23:17 UTC. Offset minutes dodge GitHub's worst
    # cron-lag marks; the spread covers US day slates and the overnight board
    # Anthony sleeps through in Zurich.
    - cron: "17 6,12,18,23 * * *"
  workflow_dispatch:
    inputs:
      min_ev:
        description: "Minimum true EV%% per unit staked"
        required: false
        default: "2.0"

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip --quiet
          pip install --quiet -r requirements.txt

      - name: Scan and log
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python chef.py scan --refresh --log --min-ev "${{ github.event.inputs.min_ev || '2.0' }}"

      # The board is only as good as the cache it reads. A stale board can't
      # produce an entry price anyone is actually offering, so surface it.
      - name: Report board freshness
        run: python chef.py coverage --days 7 || true

      - name: Commit logged picks
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/pnl/picks.json data/clv/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No new scan picks to commit."
          else
            git commit -m "scan: log line_shop shadow picks [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push
          fi
