name: PGA picks

# Daily 12:00 PM ET (16:00 UTC, EDT). run_pga.py auto-detects the active major
# via detect_active_golf_sport() and no-ops on days with no tournament, so a
# daily trigger catches every major's Thu–Sun rounds. The old Monday-only cron
# missed them all (majors are played Thu–Sun). Cheap: ~3 credits when active.
on:
  schedule:
    - cron: "19 16 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
concurrency:
  group: pga
  cancel-in-progress: false

jobs:
  pga:
    uses: ./.github/workflows/_pipeline.yml
    secrets: inherit
    with:
      level: full
      command: python run_pga.py
