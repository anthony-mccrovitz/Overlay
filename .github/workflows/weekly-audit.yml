name: Weekly audit

# Sunday 9:00 AM ET (13:00 UTC, EDT) — weekly P&L / record audit.
on:
  schedule:
    - cron: "0 13 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write
concurrency:
  group: weekly-audit
  cancel-in-progress: false

jobs:
  weekly-audit:
    uses: ./.github/workflows/_pipeline.yml
    secrets: inherit
    with:
      level: light
      command: python scripts/weekly_audit.py
