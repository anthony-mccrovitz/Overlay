name: Weekly audit

# Sunday 9:00 AM ET (13:00 UTC, EDT) — weekly P&L / record audit.
on:
  schedule:
    - cron: "29 13 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write
concurrency:
  group: weekly-audit
  cancel-in-progress: false

jobs:
  weekly-audit:
    uses: ./.github/workflows/_pipeline.yml
    secrets: inherit
    with:
      level: light
      command: |
        set +e
        fail=0
        python scripts/weekly_audit.py || fail=1
        # Refit all calibrators weekly so model probs track realized hit rates
        # (stale calibrators are what made props overconfident).
        python chef.py calibrate || fail=1
        exit $fail
