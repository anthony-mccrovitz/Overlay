name: Capture closing lines

# Always-on closing-line capture so picks get CLV even when the laptop is off.
# Runs every 15 min during the game window (UTC). The events-list poll is free
# on The Odds API (0 credits); only games actually inside the capture band cost
# a per-event credit, so frequency here is cheap. Wide --window tolerates
# GitHub's cron lag (scheduled runs can be delayed several minutes under load).
#
# Setup: add ODDS_API_KEY as a repo secret (Settings → Secrets → Actions).
# Once this is green, disable the laptop's */2 capture_closing cron to avoid
# two writers racing on the same archive files.

on:
  schedule:
    # ALL 24 hours, every 15 min. The old schedule skipped 07:00–14:59 UTC and ran
    # only every 20 min, so World Cup games (kickoffs staggered across the globe)
    # whose 90-min pre-game band didn't line up with a surviving cron tick were
    # never captured — only 1–3 of 4 WC games/day landed. The events-list poll is
    # FREE on The Odds API (0 credits); only a game actually inside the capture
    # band costs a per-event credit, so cost scales with games played, NOT with how
    # often this runs. Offset minutes (7/22/37/52) dodge GitHub's worst cron-lag marks.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}          # allow manual "Run workflow" for testing

# Don't let a slow run overlap the next scheduled tick.
concurrency:
  group: capture-closing
  cancel-in-progress: false

permissions:
  contents: write                # needed to commit captured archives back
  issues: write                  # so a failed capture can raise an alarm

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal deps
        # capture_closing only needs these (not the full ML stack).
        run: pip install --quiet pandas numpy requests python-dotenv

      - name: Capture closing lines
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        # Window MUST exceed the real gap between runs, not the scheduled one.
        # Measured 2026-07-29: this workflow asks for 96 runs/day and actually
        # gets 12.9 — GitHub drops ~87% of scheduled triggers under load. That
        # leaves an average ~112 min between ticks, so a 90-min band was NARROWER
        # THAN THE GAP: any event whose entire pre-game window fell between two
        # surviving ticks was never captured at all.
        #
        # It failed exactly where it was hardest to notice. MLB plays 15 games
        # across 10 hours, so something is always in-band and capture sat at 96%;
        # UFC runs one card a week and landed at 25%, tennis 50%. The lanes with
        # the fewest events — the ones needing every single data point to reach a
        # promotion floor — were the ones losing their closing lines.
        #
        # 240 min comfortably clears the observed gap. Cost is unchanged: the
        # events poll is free, and capture is idempotent (an event already
        # archived is re-fetched only to upgrade it to a true closing line inside
        # FINAL_WINDOW_MIN), so a wider band does not multiply per-event credits.
        #
        # Output is teed so the alert step below can quote the actual failure.
        # pipefail matters: without it the pipeline reports tee's exit code and a
        # dead capture would look green — the precise failure mode this workflow
        # was rebuilt to eliminate.
        run: |
          set -o pipefail
          python scripts/capture_closing.py --window 240 2>&1 | tee /tmp/capture.out

      - name: Alert on failure — open a GitHub issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ALERT_ONCE: this workflow fires ~13x/day, so commenting on every
          # failure would post a dozen pings a day and train you to ignore the
          # label. One issue per outage instead; close it when fixed and a
          # recurrence opens a fresh one. The daily monitor still re-pings for
          # as long as the underlying cause persists, so a lingering outage is
          # not silent — it is just not spamming from two places at once.
          ALERT_ONCE: "1"
          ALERT_INTRO: "closing-line capture is FAILING"
          ALERT_FOOTER: "Closing lines cannot be backfilled — every run that fails here loses that window's CLV permanently. Usual cause: Odds API quota exhausted (the preflight in capture_closing.py exits RED rather than archiving nothing). Close this issue once capture is green again."
        run: |
          [ -s /tmp/capture.out ] || \
            echo "capture_closing produced no output — the JOB failed before it ran (checkout / deps / python). See the Actions log." > /tmp/capture.out
          bash scripts/alert_issue.sh "🚨 Closing-line capture failing" /tmp/capture.out

      - name: Commit new archives
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/clv/closing/ logs/capture_closing.log
          if git diff --cached --quiet; then
            echo "No new closing lines this run."
            exit 0
          fi
          git commit -m "capture: closing lines $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          # Rebase on any concurrent commits (e.g. laptop cron) before pushing.
          for i in 1 2 3; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" \
               && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            # A conflicted rebase leaves unmerged files that doom every later
            # attempt. Abort so the next try replays our commit on a clean tree.
            git rebase --abort 2>/dev/null || true
            echo "push attempt $i failed, retrying…"; sleep $((i * 4))
          done
          # The runner is ephemeral: an unpushed archive dies with it, and a
          # closing line cannot be backfilled. Falling out of this loop used to
          # leave the step's status as the trailing `sleep` (exit 0) — a run
          # that lost the window reported success and the alert step above,
          # being `if: failure()`, never fired. Fail loudly instead.
          echo "::error::closing-line archives could NOT be pushed — this window's CLV is lost"
          exit 1

      # The capture alert above is `if: failure()`, which only sees steps that
      # ran BEFORE it — a push failure in the step above could never reach it.
      # This one is last, so it covers the whole job.
      - name: Alert on push failure — open a GitHub issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALERT_ONCE: "1"
          ALERT_INTRO: "closing-line capture ran but could NOT commit its archives"
          ALERT_FOOTER: "The capture itself may have succeeded — the archives died with the ephemeral runner because the push failed. Closing lines cannot be backfilled. Usual cause: a deterministic rebase conflict on data/clv/closing with another workflow."
        run: |
          echo "Push of captured closing archives failed after 3 retries. See the Actions run log for the git error." > /tmp/push_fail.out
          bash scripts/alert_issue.sh "🚨 Closing-line capture could not push" /tmp/push_fail.out
