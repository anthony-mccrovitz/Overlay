name: Night picks

# 9:30 PM ET (01:30 UTC, EDT) — generate next-day picks at line-open + deploy.
# Was: chef.py night mlb/nba/nhl/wnba (21:30–21:45 ET) + deploy (22:36/22:46 ET).
on:
  schedule:
    - cron: "33 1 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
concurrency:
  group: night
  cancel-in-progress: false

jobs:
  night:
    uses: ./.github/workflows/_pipeline.yml
    secrets: inherit
    with:
      level: full
      command: |
        # Run every step even if one fails (resilience), but track failures and
        # exit non-zero so a broken step turns the run RED instead of silently
        # green. The _pipeline commit step is if:always(), so whatever DID
        # succeed still commits — loud failure, no data loss.
        set +e
        fail=0
        python chef.py night --sport mlb  || fail=1
        python chef.py night --sport nba  || fail=1
        python chef.py night --sport nhl  || fail=1
        python chef.py night --sport wnba || fail=1
        # Factory sweep: run EVERY registered adapter lane (MLB totals/F5 + all 7
        # soccer leagues) through the one gate so the shadow lanes accumulate the
        # opening-line CLV they need to earn promotion. MLB dedups against the
        # per-sport runs above; the soccer leagues are covered here and nowhere
        # else. All shadow (card_pick=False) — no real money. Runs at line-open.
        # Must target the SAME ET-anchored slate the night pipeline uses, or a
        # UTC "tomorrow" mismatch would price picks against the wrong day's odds
        # (the phantom-edge bug). snapshot_from_pnl (in the prop runs below) then
        # freezes these picks' opening lines for CLV.
        SLATE=$(python -c "from scripts.night_pipeline import tomorrow_str; print(tomorrow_str())")
        python chef.py picks grid --date "$SLATE" || fail=1
        # Every prop pipeline runs nightly so each prop type is its own
        # CLV-tracked market. All no-op cleanly off-season / on no-event days.
        python run_mlb_props.py || fail=1
        python run_nba_props.py || fail=1
        python run_nhl_props.py || fail=1
        python run_ufc.py       || fail=1
        # Taint sweep: stamp picks from known-broken mechanisms (idempotent,
        # pinned date ranges — see scripts/taint_bad_picks.py). Keeps stats,
        # the record, and gate/calibrator fits honest.
        python scripts/taint_bad_picks.py || fail=1
        # Weekly NB prop-model retrain (Sundays UTC) — artifacts froze at
        # 2026-07-08 because no job ever refit them; the pipeline only loads.
        if [ "$(date -u +%u)" = "7" ]; then
          python -c "from src.models.mlb_props_nb import train_all_prop_models; train_all_prop_models()" || fail=1
        fi
        python scripts/deploy_picks.py --sport mlb || fail=1
        python scripts/deploy_picks.py --sport nba || fail=1
        exit $fail
