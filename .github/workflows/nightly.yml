name: Nightly grade + recap

# 3:45 AM ET (07:45 UTC, EDT) — final grade sweep + stats refresh, then the
# nightly recap card and deploy. Was: chef.py grade (3:45) + nightly_recap (3:50).
on:
  schedule:
    - cron: "47 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  nightly:
    uses: ./.github/workflows/_pipeline.yml
    secrets: inherit
    with:
      level: light
      command: |
        # Surface failures (exit RED) while still running both steps + committing
        # whatever succeeded (commit step is if:always()).
        set +e
        fail=0
        python chef.py grade                   || fail=1
        # Sweep the whole pending backlog (all sports) — catches picks that
        # missed their one-night grading window (pipeline failures, wrong
        # slate dates). Without this they rot as pending forever.
        python scripts/grade_backlog.py        || fail=1
        # Outrights (golf/nascar/f1/indycar) need --winner and are deliberately
        # SKIPPED by grade_completed.py, which defers to this script. It was
        # never scheduled anywhere: its own docstring claims "runs daily at 9 AM"
        # and its log last moved 2026-05-25, so every outright pick since has sat
        # pending — 90 of them by 2026-08-06. A grader nothing invokes is the
        # same as no grader, and the delegating comment upstream made it look
        # handled. Nothing alarmed either: the stale-pending watchdog exempts
        # market "outright" (UNGRADEABLE_MARKETS) and the three racing sports
        # (KNOWN_MANUAL_ONLY), so this backlog was invisible BY DESIGN — the
        # exemptions outlived the reason for them. Once the backlog is cleared,
        # both exemptions should be dropped so the alarm covers outrights too.
        python scripts/grade_outrights.py      || fail=1
        python scripts/nightly_recap.py --deploy || fail=1
        # After grading, rebuild the web data so the live site reflects last
        # night's results/record (the customer feed + slate carry graded picks).
        # WC futures don't change post-grade, so skip the sim here (morning does it).
        python scripts/build_customer_feed.py || fail=1
        python scripts/build_slate_data.py    || fail=1
        exit $fail
