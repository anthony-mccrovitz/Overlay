name: Gate checks

# Gate sweeps (inactives / goalies / lineups) before games.
# Live crontab: 21:00 / 22:00 / 23:00 ET → +4 = 01:00 / 02:00 / 03:00 UTC.
on:
  schedule:
    - cron: "0 1,2,3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
concurrency:
  group: gates
  cancel-in-progress: false

jobs:
  gates:
    uses: ./.github/workflows/_pipeline.yml
    secrets: inherit
    with:
      level: light
      command: python chef.py gates
