name: Integrity monitor

# Daily 1:00 PM ET (17:00 UTC, EDT) — after the (lag-prone) morning cycle has
# had time to run. Reads the committed record and LOUDLY fails (red run) if any
# in-season market has gone dark, closings stopped, or CLV isn't scoring. This
# is the alarm that catches silent component failures the morning they happen,
# instead of weeks later. A RED run here = something needs attention.
on:
  schedule:
    - cron: "51 17 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write          # so a RED run can open/update an alert issue

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pandas numpy requests python-dotenv
      - name: Integrity check (non-zero exit = RED alarm)
        id: check
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          # Three alarms, all surfaced and captured to a file so the alert step can
          # quote them: dark-market monitor + per-market CLV coverage guard (both in
          # `chef.py monitor`) + bet-tracking audit. audit goes RED if any settled
          # card bet in the window lost its closing line/CLV — a tracking leak caught
          # the day it happens.
          set +e
          python chef.py monitor > /tmp/mon.out 2>&1; m=$?
          python chef.py audit   > /tmp/aud.out 2>&1; a=$?
          cat /tmp/mon.out /tmp/aud.out | tee /tmp/monitor.out
          fail=0
          [ "$m" -ne 0 ] && fail=1
          [ "$a" -ne 0 ] && fail=1
          exit $fail

      - name: Alert on failure — open/update a GitHub issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # You don't check the dashboard daily — so a RED run must reach you. The
        # delivery logic lives in scripts/alert_issue.sh (NOT inlined here) so
        # that alert-canary.yml can exercise the real thing weekly. This step was
        # inlined once, broke on shell quoting, and swallowed 12 consecutive days
        # of legitimate alarms; see the header of that script for the post-mortem.
        run: |
          # An infrastructure failure (checkout, pip, python missing) never wrote
          # monitor.out. That case still has to reach you — "the job died before it
          # could tell you why" is exactly the silence this whole workflow exists
          # to prevent — so synthesise a body rather than skipping the alert.
          [ -s /tmp/monitor.out ] || \
            echo "The integrity monitor produced no output — the JOB itself failed (checkout / deps / python). See the Actions run log." > /tmp/monitor.out
          bash scripts/alert_issue.sh "🚨 Pipeline integrity alarm" /tmp/monitor.out
