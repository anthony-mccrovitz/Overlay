name: Morning captions + deploy

# 9:10 AM ET (13:10 UTC, EDT) — generate captions from overnight picks, deploy.
on:
  schedule:
    - cron: "13 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
concurrency:
  group: morning
  cancel-in-progress: false

jobs:
  morning:
    uses: ./.github/workflows/_pipeline.yml
    secrets: inherit
    with:
      level: light
      command: |
        # Surface failures (exit RED) while still running every step + committing
        # whatever succeeded (commit step is if:always()).
        set +e
        fail=0
        python scripts/gen_caption.py || fail=1
        # Log shadow-strategy picks while morning lines are still soft (favorite-
        # longshot etc.) — the opening half of CLV. Closings captured at tipoff,
        # scored by clv.yml next morning. card_pick=False → never the real record.
        python chef.py strategies     || fail=1
        # Rebuild the web app's data layer (overlay/src/data/) from today's picks
        # so the live site updates. These were laptop-only (chef.py deploy) and
        # never ran in the cloud, leaving the site frozen. The _pipeline commit
        # step (git add -A) commits the rebuilt JSON → triggers a Vercel deploy.
        python scripts/build_slate_data.py    || fail=1
        python scripts/wc_data.py --sims 20000 || fail=1
        python scripts/build_customer_feed.py || fail=1
        python scripts/deploy_picks.py || fail=1
        exit $fail
