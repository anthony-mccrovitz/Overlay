name: CLV backfill + refresh

# 8:00 AM ET (12:00 UTC, EDT) — backfill clv_records.json, then recompute the
# CLV dashboard (snapshots.json). Was: backfill_clv (8:00) + clv --refresh (8:10).
on:
  schedule:
    - cron: "23 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
concurrency:
  group: clv
  cancel-in-progress: false

jobs:
  clv:
    uses: ./.github/workflows/_pipeline.yml
    secrets: inherit
    with:
      level: light
      command: |
        # Surface failures (exit RED) while still running both steps + committing
        # whatever succeeded (commit step is if:always()).
        set +e
        fail=0
        python scripts/backfill_clv.py || fail=1
        python chef.py clv --refresh   || fail=1
        exit $fail
