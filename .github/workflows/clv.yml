name: CLV backfill + refresh

# 8:00 AM ET (12:00 UTC, EDT) — backfill clv_records.json, then recompute the
# CLV dashboard (snapshots.json). Was: backfill_clv (8:00) + clv --refresh (8:10).
on:
  schedule:
    - cron: "23 12 * * *"
    # Second pass at 06:23 UTC — after the last US games close. With only the
    # noon run, the freshest slate always showed ~0 scored until the NEXT day
    # ("is CLV even working?"): picks made at 15:00 UTC close at 00-05 UTC,
    # so noon-only meant up to a 30h scoring lag. Compute is archive-joins
    # only — no Odds API cost.
    - cron: "23 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
concurrency:
  group: clv
  cancel-in-progress: false

jobs:
  clv:
    uses: ./.github/workflows/_pipeline.yml
    secrets: inherit
    with:
      level: light
      command: |
        # Surface failures (exit RED) while still running both steps + committing
        # whatever succeeded (commit step is if:always()).
        set +e
        fail=0
        python scripts/backfill_clv.py || fail=1
        python chef.py clv --refresh   || fail=1
        exit $fail
